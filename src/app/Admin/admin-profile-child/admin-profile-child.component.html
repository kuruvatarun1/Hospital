<div style="margin-top: 10px;">
    <div><h5 style="text-align: center;">Welcome {{logedadmin.adminName}}</h5></div>
    <div class="row" style="margin: top 10px;margin-bottom: 15px ;">
        <div class="col-sm-3"></div>
        <div class="col-sm-3">
            <h4>AdminId :</h4>
        </div>
        <div class="col-sm-3">
            <input type="text" readonly="readonly" [(ngModel)]="logedadmin.adminID" id="txtName" class="form-control" />
        </div>
        <div class="col-sm-3"></div>
    </div>
    <div class="row" style="margin: top 10px;margin-bottom: 15px ;">
        <div class="col-sm-3"></div>
        <div class="col-sm-3">
            <h4>Name :</h4>
        </div>
        <div class="col-sm-3">
            <input type="text" readonly="readonly" readonly="readonly" [(ngModel)]="logedadmin.adminName" id="txtName" class="form-control" />
        </div>
        <div class="col-sm-3"></div>
    </div>
    <div class="row" style="margin-bottom: 10px;">
        <div class="col-sm-3"></div>
        <div class="col-sm-3">
            <h4>Email :</h4>
        </div>
        <div class="col-sm-3">
            <input type="text" readonly="readonly"  id="txtEmail" [(ngModel)]="logedadmin.email" class="form-control" />
        </div>
        <div class="col-sm-3"></div>
    </div>
    <div class="row" style="margin-bottom: 10px;">
        <div class="col-sm-3"></div>
        <div class="col-sm-3">
            <h4>Password :</h4>
        </div>
        <div class="col-sm-3">
            <input type="text" readonly="readonly" id="txtPwd" [(ngModel)]="logedadmin.password" class="form-control" />
        </div>
        <div class="col-sm-3"></div>
    </div>
    <div class="row" style="margin-bottom: 10px;">
        <div class="col-sm-3"></div>
        <div class="col-sm-3">
            <h4>Phone :</h4>
        </div>
        <div class="col-sm-3">
            <input type="text" readonly="readonly" id="txtPhone" [(ngModel)]="logedadmin.phone" class="form-control" />
        </div>
        <div class="col-sm-3"></div>
    </div>
    <div class="row" style="margin-bottom: 10px;">
        <div class="col-sm-3"></div>
        <div class="col-sm-3">
            <h4>Gender :</h4>
        </div>
        <div class="col-sm-3">
            <input type="Radio" [(ngModel)]="logedadmin.gender" disabled value="Male" name="Gender" id="radMale"/> Male
            <input type="Radio" [(ngModel)]="logedadmin.gender" disabled value="Female" name="Gender" id="radFemale"/> Female
            <input type="Radio" [(ngModel)]="logedadmin.gender" disabled value="Others" name="Gender" id="radOthers"/> Others
        </div>
        <div class="col-sm-3"></div>
    </div>
    <div class="row" style="margin-bottom: 10px;">
        <div class="col-sm-3"></div>
        <div class="col-sm-3">
            <h4>Address :</h4>
        </div>
        <div class="col-sm-3">
            <input type="text" readonly="readonly" id="txtAdrs" [(ngModel)]="logedadmin.address" class="form-control" />
        </div>
        <div class="col-sm-3"></div>
    </div>
    <div class="row" style="margin-bottom: 10px;">
        <div class="col-sm-3"></div>
        <div class="col-sm-3">
            <h4>Department :</h4>
        </div>
        <div class="col-sm-3">
            <select disabled class="form-select" [(ngModel)]="logedadmin.deptNo" aria-label="Default select example">
                <option selected>--Select--</option>
                <option value="10">Manageral Admin</option>
                <option value="20">Operational Admin</option>
              </select>
        </div>
        <div class="col-sm-3"></div>
    </div>
    <div class="row" style="margin-top: 90px;">
        <div class="col-sm-4"></div>
        <div class="col-sm-4">
            <input type="button" style="margin-left: 50px;" value="Edit" id="btnSubmit" class="btn btn-success">
            <input type="button" style="margin-left: 40px;" value="Cancel" id="btnCancel" class="btn btn-danger">
        </div>
        <div class="col-sm-4"></div>
    </div>
    
</div>
