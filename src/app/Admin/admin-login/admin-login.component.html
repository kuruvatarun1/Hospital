<div class="outer">
    <div class="row">
        <div class="col-sm-12">
            <div class="row">
                <div class="col-sm-6">
                    <img src="assets/Images/HCLSbg1.jpg" alt="img2" style="width:100%; padding: 10px; border-radius: 15px; height: 450px;"/>
                </div>
                <div class="col-sm-6">
                    <div class="row" style="background-color: whitesmoke;  margin-top: 10px; border-radius: 5px; height:435px;">
                        <div class="col-sm-12">
                            <div class="row" style="text-align: center;  margin-top: 10px; margin-bottom: 30px;">
                                <div class="col-sm-12"><h1>Login</h1></div>
                            </div>
                            <div class="row" style=" margin-bottom: 20px;">
                                <div class="col-sm-2"></div>
                                <div class="col-sm-2"><span style="font-weight: bold;">UserName</span></div>
                                <div class="col-sm-6">
                                    <input type="text" id="txtEmail"[(ngModel)]="email" class="form-control" placeholder="please enter Email...!"/>
                                </div>
                                <div class="col-sm-2"></div>
                            </div>
                            <div class="row" style=" margin-bottom: 20px;">
                                <div class="col-sm-2"></div>
                                <div class="col-sm-2"><span style="font-weight: bold;">Password</span></div>
                                <div class="col-sm-6">
                                    <input type="password" id="txtPWD" [(ngModel)]="password" class="form-control" placeholder="please enter Password...!"/>
                                </div>
                                <div class="col-sm-2"></div>
                            </div>
    
                            <div class="row" style="margin-bottom: 220px; text-align: center;">
                                <div class="col-sm-12">
                                    <input type="button" id="btnLogin" (click)="btn_LoginClick()" class="btn btn-success" value="Login"/>&nbsp;
                                    <input type="button" id="btnCancel" (click)="btnCancel_Click()"  class="btn btn-info" value="Cancel"/>
    
                                </div>
                            </div>
    
                            </div>
                        </div>
    
                    </div>
                </div>
            </div>
    </div>
</div>
